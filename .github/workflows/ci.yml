name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_dpdk_hardware_tests:
        description: Run DPDK tests on a provisioned self-hosted runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_DIST_SERVER: https://rsproxy.cn
  RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup

jobs:
  core:
    name: Core tests and checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup default 1.98.0
      - name: Check formatting
        run: cargo fmt --package rpkt --package pktfmt -- --check
      - name: Run core tests and documentation tests
        run: cargo test --package rpkt --package pktfmt
      - name: Test optional checksum backend
        run: cargo test --locked -p rpkt --features simd
      - name: Check compiler diagnostics
        run: |
          cargo build --package pktfmt --bin pktfmt
          bash pktfmt/errors/check_errors.sh "$PWD/target/debug/pktfmt"
      - name: Run Clippy
        run: cargo clippy --package rpkt --package pktfmt --all-targets
      - name: Check generated protocols
        run: bash gen_cmds.sh --check
      - name: Compile benchmark matrix
        run: cargo check --locked -p benches --bench matrix

  supported-rust:
    name: Rust 1.98 compatibility
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Check core crates with the declared Rust version
        run: cargo +1.98.0 check --package rpkt --package pktfmt

  safety:
    name: Core Miri and fuzz smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly safety tools
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          cargo +nightly install cargo-fuzz --locked
      - name: Check cursor and parser properties under Miri
        run: bash dev/check_safety.sh
      - name: Fuzz checked parsers
        run: cargo +nightly fuzz run checked_packets -- -max_len=65536 -max_total_time=30

  no-std:
    name: Core without a standard library
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust and bare-metal target
        run: rustup toolchain install 1.98.0 --profile minimal --target thumbv7em-none-eabi
      - name: Check without std on bare metal
        run: cargo +1.98.0 check -p rpkt --no-default-features --target thumbv7em-none-eabi

  dpdk-build:
    name: DPDK build
    runs-on: ubuntu-22.04
    env:
      LIBCLANG_PATH: /usr/lib/llvm-14/lib
      BINDGEN_EXTRA_CLANG_ARGS: -resource-dir /usr/lib/llvm-14/lib/clang/14.0.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install DPDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang-14 libclang-14-dev libdpdk-dev pkg-config
      - name: Compile DPDK tests
        run: cargo test --package rpkt-dpdk --tests --no-run
      - name: Compile supported DPDK examples
        run: cargo check --package rpkt-dpdk --examples --all-features

  dpdk-hardware:
    name: DPDK hardware tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dpdk_hardware_tests }}
    runs-on: [self-hosted, linux, x64, dpdk]
    timeout-minutes: 30
    env:
      DPDK_TEST_RUNNER: sudo -E
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated DPDK tests
        run: bash rpkt-dpdk/tests/run_tests.sh
