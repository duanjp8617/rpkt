name: Verus buffer and generated bounds
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_DIST_SERVER: https://rsproxy.cn
      RUSTUP_UPDATE_ROOT: https://rsproxy.cn/rustup
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup toolchain install 1.98.1 --profile minimal
      - name: Fetch pinned Verus release
        run: |
          curl --fail --location --retry 3 \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.09.20.aef82ed/verus-0.2026.09.20.aef82ed-x86-linux.zip \
            -o "$RUNNER_TEMP/verus.zip"
          echo "7b870fa12bc589015c2fab60a8b3d9f07c7b1adb3444eb0fadffcbf7f0447b33  $RUNNER_TEMP/verus.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/verus.zip" -d "$RUNNER_TEMP/verus"
      - name: Fetch compiler dependencies
        run: cargo fetch --locked
      - name: Verify models, shared arithmetic, generated ranges and negative controls
        env:
          VERUS: ${{ runner.temp }}/verus/verus-x86-linux/verus
        run: bash dev/verify_verus.sh
