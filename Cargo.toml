[workspace]
members = [
  "rpkt",
  "pktfmt",
  "rpkt-dpdk",
  "benches"
]
resolver = "2"
exclude = ["examples"]

# Keep normal release builds inexpensive; opt into whole-program optimization
# explicitly for measured DPDK/benchmark deployments.
[profile.bench]
lto = "fat"
codegen-units = 1

[profile.performance]
inherits = "release"
lto = "fat"
codegen-units = 1

[workspace.package]
repository = "https://github.com/duanjp8617/rpkt"
authors = ["duanjp8617 <duanjp8617@gmail.com>"]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
